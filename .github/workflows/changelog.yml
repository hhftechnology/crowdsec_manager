name: Changelog

on:
  pull_request:
    branches:
      - dev-fix

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require a conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -eu
          if printf '%s\n' "$TITLE" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|security|style|test)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "Title is a conventional commit."
          else
            echo "Pull request title must be a conventional commit, for example: fix(api): describe the change"
            exit 1
          fi

      - name: Require a changelog entry
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE"
          if git diff --name-only "origin/${BASE}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is part of this pull request."
          else
            echo "Add an entry under Unreleased in CHANGELOG.md."
            exit 1
          fi
